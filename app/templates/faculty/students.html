{% extends "base.html" %}
{% block content %}

<h2 class="page-title">Students</h2>
<p class="section-subtitle">Assigned batch: <strong>{{ batch.name if batch else "Not Assigned" }}</strong></p>

<div class="card-modern">

<table class="student-table">

<thead>
<tr>
<th>Name</th>
<th>PRN</th>
<th>Year</th>
<th>Progress</th>
</tr>
</thead>

<tbody>

{% for s in students %}
<tr>

<td>
<div class="student-name">
<i class="fas fa-user-circle"></i>
<span>{{ s.name }}</span>
</div>
</td>

<td>{{ s.prn }}</td>

<td>{{ s.year }}</td>

<td class="progress-cell">
<div class="progress-circle progress-circle-modern" style="--progress: {{ s.progress or 0 }}%;">
    <span class="circle-value">{{ s.progress or 0 }}%</span>
</div>
</td>

</tr>
{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
