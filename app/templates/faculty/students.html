{% extends "base.html" %}
{% block content %}

<h2 class="page-title">Students</h2>

<div class="card-modern">

<table class="student-table">

<thead>
<tr>
<th>Name</th>
<th>PRN</th>
<th>Year</th>
<th>Progress</th>
</tr>
</thead>

<tbody>

{% for s in students %}
<tr>

<td class="student-name">
<i class="fas fa-user-circle"></i>
{{ s.name }}
</td>

<td>{{ s.prn }}</td>

<td>{{ s.year }}</td>

<td>
<div class="progress-circle" data-progress="{{ s.progress or 0 }}">
    <span>{{ s.progress or 0 }}%</span>
</div>
</td>

</tr>
{% endfor %}

</tbody>

</table>

</div>

{% endblock %}
